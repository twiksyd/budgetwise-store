name: Final read-only public catalog audit

on:
  push:
    branches:
      - codex/catalog-public-price-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit public catalog and checkout API
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-public-prices.mjs
      - name: Check rendered prices on all repriced game pages
        run: node scripts/check-rendered-catalog-prices.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-public-catalog-audit
          path: |
            catalog-public-price-audit.json
            rendered-catalog-price-audit.json
