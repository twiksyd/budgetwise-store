name: Cloudflare staging

on:
  push:
    branches:
      - codex/cloudflare-open-next-current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgetwise-cloudflare-staging
  cancel-in-progress: false

jobs:
  linux-build-test:
    name: Linux build and unit tests (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run order and chat unit tests
        run: |
          pnpm test:chat
          pnpm test:order-integrity
          pnpm test:order-message

      - name: Build OpenNext against a read-only local Supabase mock
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          ROBLOX_IDENTITY_SOURCE: json
        shell: bash
        run: |
          node scripts/mock-supabase-build.mjs > "$RUNNER_TEMP/mock-supabase.log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:54321/rest/v1/store_games >/dev/null; then break; fi
            sleep 1
          done
          NEXT_TELEMETRY_DISABLED=1 pnpm build:cloudflare

  deploy-preview:
    name: Deploy temporary Worker (production Supabase connection)
    needs: linux-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check temporary preview credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            NEXT_PUBLIC_SUPABASE_URL PREVIEW_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Temporary Worker not deployed"
              echo "Add these secrets to enable the temporary production-backed preview:"
              for name in "${missing[@]}"; do printf -- '- %s\n' "$name"; done
              echo "The Linux build and unit-test job does not use these production credentials."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out branch
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Worker with production catalog reads and read-only admin build mock
        if: steps.credentials.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUILD_MOCK_URL: http://127.0.0.1:54321
          ROBLOX_IDENTITY_SOURCE: json
        shell: bash
        run: |
          node scripts/mock-supabase-build.mjs > "$RUNNER_TEMP/mock-supabase.log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:54321/rest/v1/store_games >/dev/null; then break; fi
            sleep 1
          done
          pnpm build:cloudflare

      - name: Ensure staging cache bucket exists
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if ! pnpm exec wrangler r2 bucket list | grep -Fq 'budgetwise-store-cache-staging'; then
            pnpm exec wrangler r2 bucket create budgetwise-store-cache-staging
          fi

      - name: Deploy isolated Worker directly with Wrangler
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          pnpm deploy:cloudflare:direct 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | tail -n 1)
          if [[ -z "$url" ]]; then echo "Could not read workers.dev URL from deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Temporary staging URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Set production Supabase runtime secrets on the temporary Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | pnpm exec wrangler secret put NEXT_PUBLIC_SUPABASE_URL --name budgetwise-store-staging
          printf '%s' "$PREVIEW_SUPABASE_ANON_KEY" | pnpm exec wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --name budgetwise-store-staging
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name budgetwise-store-staging

      - name: Read-only temporary Worker smoke checks
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_STAGING_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          pnpm exec wrangler tail budgetwise-store-staging --format json > "$RUNNER_TEMP/worker-tail.jsonl" 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 4
          for path in / /games /checkout /admin/login /api/reviews /api/catalog/items /api/admin/inbox; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$CF_STAGING_URL$path")
            printf '%s %s\n' "$status" "$path"
          done
          sleep 3
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/worker-tail.jsonl', 'utf8').split(/\r?\n/);
          for (const line of lines) {
            try {
              const event = JSON.parse(line);
              const path = event.event?.request?.url ? new URL(event.event.request.url).pathname : 'unknown';
              const errors = (event.logs ?? []).filter((item) => item.level === 'error')
                .map((item) => String(item.message ?? '').replace(/eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g, '[redacted-token]'));
              const exceptions = (event.exceptions ?? []).map((item) => `${item.name}: ${item.message}`
                .replace(/eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g, '[redacted-token]'));
              if (event.cpuTime !== undefined || errors.length || exceptions.length) {
                console.log(JSON.stringify({ path, cpuTime: event.cpuTime, outcome: event.outcome, errors, exceptions }));
              }
            } catch {}
          }
          NODE
