name: Add Run a Sari Sari store Toymaker Bundle

on:
  push:
    branches:
      - codex/catalog-sari-sari-store-toymaker-bundle

permissions:
  contents: read

concurrency:
  group: budgetwise-add-sari-sari-store-toymaker-bundle
  cancel-in-progress: false

jobs:
  add-product:
    name: Verify Run a Sari Sari store and add Toymaker Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Add and verify Toymaker Bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/add-sari-sari-store-toymaker-bundle.mjs
