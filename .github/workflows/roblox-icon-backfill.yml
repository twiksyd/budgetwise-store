name: Deterministic Roblox icon backfill

# Runs the automation-safe game-icon resolver on a schedule so newly-added
# games with a verified Roblox identity eventually get games.icon_url
# populated without a human running `npm run db:backfill-icons-deterministic`
# by hand.
#
# Identity source: the ROBLOX_IDENTITY_SOURCE repository variable (json or
# db; unset means json). Production is db: public.game_roblox_identity is
# authoritative, and a game verified in XOB becomes eligible for icon
# resolution on its own, no matching edit to the legacy JSON config required.
# An invalid ROBLOX_IDENTITY_SOURCE value fails the resolver step.
#
# Preflight: before any icon write, the DB preflight step validates
# public.game_roblox_identity in isolation (loads cleanly, valid statuses,
# valid + non-duplicate verified universe ids). It no longer compares against
# src/config/roblox-universe-ids.json -- that exact-parity requirement was
# the old transition/bake gate and blocked newly-verified games until someone
# hand-edited the JSON file too. If the preflight fails (exit 1) or cannot
# run (exit 2), the job stops and the resolver never runs. When
# ROBLOX_IDENTITY_SOURCE is "json" (emergency rollback), the preflight is a
# no-op and the resolver reads the JSON file as before.
#
# This workflow runs scripts/backfill-game-icons-deterministic.mjs only.
# That script never calls the fuzzy Roblox search helpers in
# scripts/lib/roblox-icon-resolver.mjs (see scripts/test-roblox-identity.mjs).
# Never point this workflow at scripts/backfill-game-icons.mjs (the manual,
# human-triggered fuzzy-discovery tool).
on:
  schedule:
    # 07:17 UTC daily — low traffic, off the top of the hour to avoid
    # GitHub Actions' scheduling congestion window. Artwork resolution has
    # no latency requirement, so a daily cadence is more than sufficient.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Roblox identity DB preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROBLOX_IDENTITY_SOURCE: ${{ vars.ROBLOX_IDENTITY_SOURCE || 'json' }}
        run: npm run db:check-roblox-identity-db-preflight

      - name: Run deterministic Roblox icon resolver
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROBLOX_IDENTITY_SOURCE: ${{ vars.ROBLOX_IDENTITY_SOURCE || 'json' }}
        run: node scripts/backfill-game-icons-deterministic.mjs
