name: Diagnose temporary Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: pnpm install --frozen-lockfile
      - name: Capture one home-page request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_STAGING_URL: https://budgetwise-store-staging.almalabanan16.workers.dev
        shell: bash
        run: |
          pnpm exec wrangler tail budgetwise-store-staging --format pretty > "$RUNNER_TEMP/worker-tail.log" 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 5
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$CF_STAGING_URL/")
          echo "Home page GET status: $status"
          sleep 3
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let log = fs.readFileSync(process.env.RUNNER_TEMP + '/worker-tail.log', 'utf8');
          log = log.replace(/eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g, '[redacted-token]')
            .replace(/(Bearer\s+)[A-Za-z0-9._~+/-]+=*/gi, '$1[redacted]')
            .replace(/([?&][^=\s]+)=([^&\s]+)/g, '$1=[redacted]');
          const relevant = log.split(/\r?\n/).filter((line) =>
            /error|exception|cpu|throw|unhandled|TypeError|ReferenceError|Internal Server|tail|permission|authoriz/i.test(line),
          );
          console.log(relevant.join('\n') || 'No Worker tail output was received.');
          NODE
