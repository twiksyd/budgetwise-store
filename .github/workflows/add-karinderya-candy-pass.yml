name: Add Karinderya Candy Pass

on:
  push:
    branches:
      - codex/catalog-karinderya-candy-pass

permissions:
  contents: read

concurrency:
  group: budgetwise-add-karinderya-candy-pass
  cancel-in-progress: false

jobs:
  add-product:
    name: Verify Karinderya and restore Candy Pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Add and verify Candy Pass
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/add-karinderya-candy-pass.mjs
